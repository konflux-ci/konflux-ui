# Components for flow visualization testing
# 20 components: 6 in product-grp1, 5 in platform-infra, 9 ungrouped
# Variables are substituted from config.env via envsubst
---
# === product-grp1 components ===
apiVersion: appstudio.redhat.com/v1alpha1
kind: Component
metadata:
  name: backend-api
spec:
  componentName: backend-api
  application: product-grp1
  source:
    git:
      url: ${BACKEND_API_REPO}
      revision: ${BACKEND_API_REVISION}
  containerImage: ${IMAGE_REGISTRY}/backend-api
---
