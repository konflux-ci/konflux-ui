# .fullsend/harness/code.yaml
base: https://raw.githubusercontent.com/fullsend-ai/agents/464978aaf476ee134e7315ca763df74c746dbae4/harness/code.yaml#sha256=acc740396e9b5959fb976550ddc7eafc7778dd7611b385131f4fbd252ed8c08d

openshell:
  profiles:
    - profiles/fullsend-vertex-ai.yaml
    - profiles/fullsend-package-registries.yaml
    - profiles/fullsend-gitleaks.yaml

trigger: >
  event.entity.kind == "work_item"
    && (
      (event.transition.kind == "label_changed"
        && event.transition.label.name == "ready-to-code"
        && event.transition.label.action == "added")
      ||
      (event.transition.kind == "comment_added"
        && has(event.transition.comment.command)
        && event.transition.comment.command == "/fs-code")
    )

allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/agents/

env:
  runner:
    CODE_ALLOWED_TARGET_BRANCHES: 'main'
