# .fullsend/harness/triage.yaml
base: https://raw.githubusercontent.com/fullsend-ai/agents/464978aaf476ee134e7315ca763df74c746dbae4/harness/triage.yaml#sha256=9831609106035f7d0ac7d6e95fbc971ceb11afd9d74ec75dd53873c20eeb3ed4

openshell:
  profiles:
    - profiles/fullsend-vertex-ai.yaml

trigger: >
  event.entity.kind == "work_item"
    && (
      (event.transition.kind == "opened"
        && "fullsend" in event.state.labels)
      ||
      (event.transition.kind == "label_changed"
        && event.transition.label.name == "fullsend"
        && event.transition.label.action == "added")
      ||
      (event.transition.kind == "comment_added"
        && has(event.transition.comment.command)
        && event.transition.comment.command == "/fs-triage")
    )

allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/agents/

overlays:
  - when: 'runtime.forge == "jira"'
    env:
      runner:
        # KFLUXUI doesn't have special transitions - just "closed"
        JIRA_DUPLICATE_TRANSITION: Closed
        JIRA_NOT_PLANNED_TRANSITION: Closed
        JIRA_SPLIT_TRANSITION: Closed
