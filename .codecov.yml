codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 2 # 2 builds are required for merge queue. To wait for both shards to finish before announcing the coverage status
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: '60...80'
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 85%
        informational: false
        threshold: 0%

ignore:
  - '**/*__data__*/*.ts'
  - '.agents/**'
  - '.claude/**'
  - '.cursor/**'
  - 'skills/**'
  - 'docs/**'
  - '*.md'
  - '*.toml'

comment:
  layout: 'reach,diff,flags,files,footer'
  behavior: default
  require_changes: false
