name: fullsend Jira poll

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch: {} # allow manual runs

permissions: {}

jobs:
  poll:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: fullsend-jira-poll
      cancel-in-progress: false
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install fullsend
        uses: fullsend-ai/fullsend/.github/actions/install-fullsend-cli@5e6f41157a2163af1df290d2e01db827b38a7d8f # main as of 2026-09-23

      - name: Poll Jira
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          fullsend poll \
            --input-driver jira-poll \
            --jira-url "${JIRA_BASE_URL}" \
            --jira-project KFLUXUI \
            --jql '(project=KFLUXUI OR (project=KONFLUX AND component=UI)) and type=Bug and statusCategory != Done and updated > -1week and labels=fullsend' \
            --target-repo "${TARGET_REPO}" \
            --output dispatches.json \
            --fullsend-dir .fullsend

      - name: Build dispatch matrix
        id: build-matrix
        run: |
          set -euo pipefail
          # Validate JSON first
          jq empty dispatches.json
          # Check if empty
          if ! jq -e 'length > 0' dispatches.json > /dev/null; then
            echo "No dispatches."
            echo 'matrix={"include":[]}' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          MATRIX=$(jq -c '{include: .}' dispatches.json)
          DELIM="MATRIX_$(openssl rand -hex 8)"
          {
            echo "matrix<<${DELIM}"
            printf '%s' "${MATRIX}"
            echo
            echo "${DELIM}"
          } >> "${GITHUB_OUTPUT}"

  harness:
    # Use reusable-dispatch.yml with pre-computed matrix input.
    # The poll job above replaces both route and harness-dispatch: the CEL
    # trigger matching is done by `fullsend poll` (PR #6340) and the matrix
    # is pre-built from dispatches.json. When matrix is provided, reusable-dispatch
    # skips routing/dispatch and goes directly to harness-run (PR #6455).
    #
    # Resolves fullsend-ai/fullsend#6347
    #
    # Security note: reusable-dispatch.yml is pinned to @main (not SHA) to receive
    # updates automatically. This follows the pattern established in fullsend.yaml.
    # The fullsend-ai/fullsend repo has branch protection on main.
    name: Harness
    needs: poll
    permissions:
      actions: write
      contents: write
      id-token: write
      issues: write
      packages: read
      pull-requests: write
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@main
    with:
      matrix: ${{ needs.poll.outputs.matrix }}
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
