name: PR Check Test

# Runs from the default branch, so a fork cannot change who is allowed to start E2E.
# A repository member's own pull request starts E2E from PR Check Prepare.
# Everyone else needs a member to comment `/ok-to-test <full-sha>` for the current head.
on:
  workflow_run:
    workflows: ["PR Check Prepare"]
    types: [completed]
  issue_comment:
    types: [created]

concurrency:
  group: pr-check-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-org-membership:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ok-to-test'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      run_e2e: ${{ steps.gate.outputs.run_e2e }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    steps:
      - name: Decide whether E2E may run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PREPARE_ACTION: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail

          run_e2e=false
          pr_number=""
          head_sha=""

          # Triage and read are not enough. Approval requires admin, maintain, or write.
          has_write_access() {
            local user="$1"
            local role
            if ! role=$(gh api "repos/${REPO}/collaborators/${user}/permission" --jq .role_name 2>/dev/null); then
              return 1
            fi
            [[ "$role" == "admin" || "$role" == "maintain" || "$role" == "write" ]]
          }

          is_trusted_bot() {
            [[ "$1" == "red-hat-konflux[bot]" || "$1" == "konflux-ci-coder[bot]" || "$1" == "fullsend-ai-coder[bot]" ]]
          }

          pr_has_ok_to_test() {
            local found
            found=$(gh pr view "$pr_number" --repo "$REPO" --json labels --jq 'any(.labels[]; .name == "ok-to-test")')
            [[ "$found" == "true" ]]
          }

          finish() {
            echo "run_e2e=${run_e2e}" >> "$GITHUB_OUTPUT"
            echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            first_line=$(printf '%s\n' "$COMMENT_BODY" | head -n 1 | tr -d '\r')
            command=$(printf '%s\n' "$first_line" | awk '{print $1}')
            approved_sha=$(printf '%s\n' "$first_line" | awk '{print $2}')
            extra=$(printf '%s\n' "$first_line" | awk '{print $3}')
            if [[ "$command" != "/ok-to-test" ]]; then
              echo "Ignoring a comment that does not start with /ok-to-test."
              finish
            fi

            pr_number="$ISSUE_NUMBER"
            pr_json=$(gh pr view "$pr_number" --repo "$REPO" --json headRefOid,author)
            head_now=$(echo "$pr_json" | jq -r .headRefOid | tr '[:upper:]' '[:lower:]')
            author=$(echo "$pr_json" | jq -r .author.login)

            if ! has_write_access "$COMMENTER"; then
              gh pr comment "$pr_number" --repo "$REPO" --body "E2E was not started. @${COMMENTER} does not have write access. A repository member with write access must comment \`/ok-to-test <full-sha>\` after reviewing that commit."
              echo "Rejected /ok-to-test from ${COMMENTER} on ${author}'s pull request."
              finish
            fi

            if [[ ! "$approved_sha" =~ ^[0-9a-fA-F]{40}$ || -n "$extra" ]]; then
              gh pr comment "$pr_number" --repo "$REPO" --body "E2E was not started. Comment \`/ok-to-test ${head_now}\` to approve that commit. The SHA must be the full 40-character head, not a shorter id."
              echo "Rejected /ok-to-test because the SHA was missing or not a full commit id."
              finish
            fi

            approved_sha=$(printf '%s' "$approved_sha" | tr '[:upper:]' '[:lower:]')
            if [[ "$approved_sha" != "$head_now" ]]; then
              gh pr comment "$pr_number" --repo "$REPO" --body "E2E was not started. \`${approved_sha}\` is not the current head \`${head_now}\`. Comment \`/ok-to-test ${head_now}\` to approve the current commit. The previous SHA was not replaced."
              echo "Rejected /ok-to-test for ${approved_sha}. Current head is ${head_now}."
              finish
            fi

            head_sha="$approved_sha"
            gh label create "ok-to-test" --repo "$REPO" --color "0E8A16" --description "E2E approved for one commit" >/dev/null 2>&1 || true
            gh pr edit "$pr_number" --repo "$REPO" --add-label "ok-to-test"
            gh pr comment "$pr_number" --repo "$REPO" --body "E2E started for \`${head_sha}\` by @${COMMENTER}. ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            run_e2e=true
            echo "${COMMENTER} approved E2E for ${author} at ${head_sha}."
            finish
          fi

          # Automatic path for authors who already have write access.
          if [[ -n "$WORKFLOW_PR_NUMBER" ]]; then
            pr_number="$WORKFLOW_PR_NUMBER"
          else
            pr_number=$(gh api "repos/${REPO}/commits/${WORKFLOW_HEAD_SHA}/pulls" --jq '[.[] | select(.state == "open")] | .[0].number // empty' || true)
          fi
          if [[ -z "$pr_number" ]]; then
            echo "No open pull request for ${WORKFLOW_HEAD_SHA}."
            finish
          fi

          author=$(gh pr view "$pr_number" --repo "$REPO" --json author --jq .author.login)
          head_now=$(gh pr view "$pr_number" --repo "$REPO" --json headRefOid --jq .headRefOid | tr '[:upper:]' '[:lower:]')
          pinned_sha=$(printf '%s' "$WORKFLOW_HEAD_SHA" | tr '[:upper:]' '[:lower:]')
          if [[ "$head_now" != "$pinned_sha" ]]; then
            echo "Pull request head is ${head_now}. This run is for ${pinned_sha}, so it will not test the new commit."
            finish
          fi
          head_sha="$pinned_sha"

          if is_trusted_bot "$author" || has_write_access "$author"; then
            if [[ "$PREPARE_ACTION" == "edited" ]]; then
              echo "Edit from ${author}. Not starting E2E."
              finish
            fi
            run_e2e=true
            echo "Author ${author} can run E2E without /ok-to-test."
            finish
          fi

          if pr_has_ok_to_test; then
            gh pr edit "$pr_number" --repo "$REPO" --remove-label "ok-to-test"
            echo "Removed ok-to-test. ${author} needs a new /ok-to-test <full-sha> comment from a repository member."
          else
            echo "E2E was not started for ${author}."
          fi
          finish

  deploy-konfux-ui:
    needs: check-org-membership
    if: ${{ needs.check-org-membership.outputs.run_e2e == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      # secrets
      CYPRESS_GH_TOKEN: ${{ secrets.HAC_TEST_GH_TOKEN }}
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
      QUAY_TEST_ORG: ${{ secrets.QUAY_TEST_ORG }}
      QUAY_TOKEN_TEST: ${{ secrets.QUAY_TOKEN_TEST }}
      SMEE_URL: ${{ secrets.SMEE_URL }}
      CYPRESS_USERNAME: ${{ secrets.CYPRESS_USERNAME }}
      CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
      CYPRESS_KONFLUX_BASE_URL: 'https://localhost:9443'
      CYPRESS_PROJECT_ID: ${{ secrets.PROJECT_ID }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      JOB_TYPE: 'on-pr'
    steps:
      - name: Checkout the approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.check-org-membership.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout trusted workflow files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Confirm the approved commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.check-org-membership.outputs.pr_number }}
          APPROVED_SHA: ${{ needs.check-org-membership.outputs.head_sha }}
        run: |
          set -euo pipefail
          # This step only reads the pull request. Drop job secrets before that.
          unset CYPRESS_GH_TOKEN GH_APP_ID GH_APP_PRIVATE_KEY GH_APP_WEBHOOK_SECRET \
            QUAY_TEST_ORG QUAY_TOKEN_TEST SMEE_URL CYPRESS_USERNAME CYPRESS_PASSWORD \
            CYPRESS_PROJECT_ID CYPRESS_RECORD_KEY CODECOV_TOKEN
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$APPROVED_SHA" ]]; then
            echo "Refusing to test ${actual}. The approved commit is ${APPROVED_SHA}."
            exit 1
          fi

          head_now=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid | tr '[:upper:]' '[:lower:]')
          if [[ "$head_now" != "$APPROVED_SHA" ]]; then
            echo "Pull request head is ${head_now}. Approval was for ${APPROVED_SHA}, so this run will not test the new commit."
            exit 1
          fi

          json=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title,author,headRefName,baseRefName,headRepository,headRepositoryOwner)
          owner=$(echo "$json" | jq -r .headRepositoryOwner.login)
          name=$(echo "$json" | jq -r .headRepository.name)
          {
            echo "HEAD_SHA=${APPROVED_SHA}"
            echo "PR_NUMBER=${PR_NUMBER}"
            echo "SOURCE_BRANCH=$(echo "$json" | jq -r .headRefName)"
            echo "TARGET_BRANCH=$(echo "$json" | jq -r .baseRefName)"
            echo "COMMIT_INFO_SHA=${APPROVED_SHA}"
            echo "COMMIT_INFO_BRANCH=$(echo "$json" | jq -r .headRefName)"
            echo "COMMIT_INFO_AUTHOR=$(echo "$json" | jq -r .author.login)"
            echo "FORKED_REPO_URL=https://github.com/${owner}/${name}.git"
            echo "BASE_REPO_URL=https://github.com/${REPO}.git"
            echo "COMMIT_INFO_MESSAGE<<ENDOFTITLE"
            echo "$(echo "$json" | jq -r .title)"
            echo "ENDOFTITLE"
          } >> "$GITHUB_ENV"

      - name: Enable Corepack 📦
        run: corepack enable

      - name: Disc space stats
        run: |
          set -x
          df -h --total
          free -m

      # Redirect Cypress Cache to /mnt to free up disk space on /dev/root
      - name: Redirect Cypress Cache to /mnt
        run: |
          sudo mkdir -p /mnt/cypress_cache
          sudo chown -R runner:docker /mnt/cypress_cache
          # Create the link so Cypress installs to /mnt instead of /
          mkdir -p ~/.cache
          ln -s /mnt/cypress_cache ~/.cache/Cypress

      - name: Force Docker to /mnt
        run: |
          # Stop Docker completely
          sudo systemctl stop docker.socket
          sudo systemctl stop docker

          sudo mkdir -p /mnt/docker

          # Create a Systemd Override (This is more powerful than daemon.json)
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd --data-root=/mnt/docker -H fd://' | sudo tee /etc/systemd/system/docker.service.d/override.conf

          sudo systemctl daemon-reload
          sudo systemctl start docker

      - name: Move npm/yarn cache to /mnt
        run: |
          sudo mkdir -p /mnt/npm_cache
          sudo chown -R runner:docker /mnt/npm_cache
          sudo npm config set cache /mnt/npm_cache --global
          # Configure Yarn Berry cache location
          sudo mkdir -p /mnt/yarn_cache
          sudo chown -R runner:docker /mnt/yarn_cache
          export YARN_CACHE_FOLDER=/mnt/yarn_cache

      - name: Redirect Podman Storage to /mnt
        run: |
          # 1. Create the new storage directory
          sudo mkdir -p /mnt/podman_storage
          sudo chown -R runner:docker /mnt/podman_storage

          # 2. Create/Override the Podman storage config
          mkdir -p ~/.config/containers
          cat <<EOF > ~/.config/containers/storage.conf
          [storage]
          driver = "overlay"
          graphroot = "/mnt/podman_storage"
          EOF

          # 3. Verify the change
          podman info --format '{{.Store.GraphRoot}}'

      - name: Deploy konflux-ci
        id: pr-check-action
        uses: ./trusted/.github/actions/konflux-ui-deploy-test
        with:
          job-type: ${{ env.JOB_TYPE }}

      - name: Disc space stats after deploy
        run: |
          set -x
          df -h --total
          free -m 
          kubectl describe nodes

      - name: Konflux-ui e2e test
        uses: ./trusted/.github/actions/konflux-ui-e2e-test
        with:
          send-report: 'false'

      - name: Restore trusted workflow files
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted
          clean: true
          persist-credentials: false

      - name: Upload e2e coverage to Codecov
        if: ${{ success() && env.CODECOV_TOKEN != '' }}
        env:
          APPROVED_SHA: ${{ needs.check-org-membership.outputs.head_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$APPROVED_SHA" ]]; then
            echo "Refusing to upload coverage from ${actual}. The approved commit is ${APPROVED_SHA}."
            exit 1
          fi
          "$GITHUB_WORKSPACE/trusted/pr_check.sh" upload-coverage

      - name: Disc space stats after e2e test
        if: ${{ always() }}
        run: |
          unset CYPRESS_GH_TOKEN GH_APP_ID GH_APP_PRIVATE_KEY GH_APP_WEBHOOK_SECRET \
            QUAY_TEST_ORG QUAY_TOKEN_TEST SMEE_URL CYPRESS_USERNAME CYPRESS_PASSWORD \
            CYPRESS_PROJECT_ID CYPRESS_RECORD_KEY CODECOV_TOKEN
          set -x
          df -h --total
          free -m
          kubectl describe nodes
          # This finds the top 10 largest directories on the root partition
          du -h / --max-depth=2 2>/dev/null | sort -hr | head -n 10

      - name: Generate error logs
        if: ${{ always() }}
        uses: ./trusted/.github/actions/generate-error-logs
        env:
          CYPRESS_GH_TOKEN: ""
          GH_APP_ID: ""
          GH_APP_PRIVATE_KEY: ""
          GH_APP_WEBHOOK_SECRET: ""
          QUAY_TEST_ORG: ""
          QUAY_TOKEN_TEST: ""
          SMEE_URL: ""
          CYPRESS_USERNAME: ""
          CYPRESS_PASSWORD: ""
          CYPRESS_PROJECT_ID: ""
          CYPRESS_RECORD_KEY: ""
          CODECOV_TOKEN: ""
