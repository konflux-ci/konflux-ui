name: UI Lint, Unit Tests & Bundle Size

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the main branch
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  # Triggers the workflow on manual dispatch
  workflow_dispatch:

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Lint, restricted imports, and type checking — runs once in parallel with test shards
  lint:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack 📦
        run: corepack enable

      - name: Setup ⚙️ Node.js 🔰
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'yarn'

      # e2e-tests install is needed because eslint resolves eslint-plugin-cypress from e2e-tests/.eslintrc.cjs
      - name: Install Dependencies 🥁
        run: |
          yarn install --immutable
          cd e2e-tests
          yarn install --immutable
          cd ..

      - name: Lint ✅
        run: yarn lint

      - name: Lint Restricted Imports ✅
        run: yarn lint:restricted-imports

      - name: Type Checking
        run: yarn type-checks

  # Production bundle gzip — fails PRs when total measured gzip grows more than 2 kB vs base branch
  size-limit:
    name: Bundle size comparison
    runs-on: ubuntu-latest
    env:
      BUNDLE_MAX_GROWTH_BYTES: 2048
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

    steps:
      - name: Checkout PR head 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_HEAD_SHA }}

      - name: Enable Corepack 📦
        run: corepack enable

      - name: Setup ⚙️ Node.js 🔰
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Install Dependencies 🥁
        run: yarn install --immutable

      - name: Build and measure PR bundle
        run: |
          cp .github/scripts/compare-bundle-delta.mjs "${RUNNER_TEMP}/compare-bundle-delta.mjs"
          # Keep PR chunk definitions for both builds; config paths are resolved relative to the config file (repo root, not RUNNER_TEMP).
          cp .size-limit.json "${RUNNER_TEMP}/size-limit.pr.json"
          rm -rf dist
          yarn build
          cp "${RUNNER_TEMP}/size-limit.pr.json" .size-limit.ci.json
          yarn size-limit --config .size-limit.ci.json --json > "${RUNNER_TEMP}/pr-size-limit.json"

      - name: Build and measure base branch bundle
        if: env.BASE_SHA != ''
        run: |
          git fetch --no-tags origin "${BASE_SHA}"
          git checkout --force FETCH_HEAD
          yarn install --immutable
          rm -rf dist
          yarn build
          cp "${RUNNER_TEMP}/size-limit.pr.json" .size-limit.ci.json
          yarn size-limit --config .size-limit.ci.json --json > "${RUNNER_TEMP}/base-size-limit.json"

      - name: Compare bundle growth vs base
        id: size-limit
        if: env.BASE_SHA != ''
        run: |
          node "${RUNNER_TEMP}/compare-bundle-delta.mjs" \
            "${RUNNER_TEMP}/base-size-limit.json" \
            "${RUNNER_TEMP}/pr-size-limit.json" \
            --max-bytes "${BUNDLE_MAX_GROWTH_BYTES}" \
            --output bundle-size-delta.json

      - name: Bundle growth check skipped
        if: env.BASE_SHA == ''
        run: |
          echo "::warning::Bundle growth comparison runs only for pull_request and merge_group events."

      - name: Upload bundle size results
        if: failure() && steps.size-limit.outcome == 'failure'
        run: |
          staging="${RUNNER_TEMP}/size-limit-log"
          mkdir -p "${staging}"
          cp bundle-size-delta.json "${staging}/"
          cp "${RUNNER_TEMP}/base-size-limit.json" "${staging}/"
          cp "${RUNNER_TEMP}/pr-size-limit.json" "${staging}/"
      - name: Upload size-limit-log artifact
        if: failure() && steps.size-limit.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: size-limit-log
          path: ${{ runner.temp }}/size-limit-log

  # Unit tests — sharded across 2 runners for parallel execution
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack 📦
        run: corepack enable

      - name: Setup ⚙️ Node.js 🔰
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Install Dependencies 🥁
        run: yarn install --immutable

      - name: Run unit tests 🧪 (shard ${{ matrix.shard }}/2)
        run: yarn test --maxWorkers=2 --coverage --silent --ci --verbose=false --shard=${{ matrix.shard }}/2
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: shard-${{ matrix.shard }}
          fail_ci_if_error: true
