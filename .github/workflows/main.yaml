name: UI Lint, Unit Tests & Bundle Size

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the main branch
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Lint, restricted imports, and type checking — runs once in parallel with test shards
  lint:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack 📦
        run: corepack enable

      - name: Setup ⚙️ Node.js 🔰
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'yarn'

      # e2e-tests install is needed because eslint resolves eslint-plugin-cypress from e2e-tests/.eslintrc.cjs
      - name: Install Dependencies 🥁
        run: |
          yarn install --immutable
          cd e2e-tests
          yarn install --immutable
          cd ..

      - name: Lint ✅
        run: yarn lint

      - name: Lint and format local CLI authentication helpers
        run: |
          yarn lint:dev-auth
          yarn format:dev-auth

      - name: Lint Restricted Imports ✅
        run: yarn lint:restricted-imports

      - name: Type Checking
        run: yarn type-checks

  # Production bundle gzip — fails when a chunk exceeds its ceiling or total gzip grows more than 2 kB vs base
  size-limit:
    name: Bundle size comparison
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUNDLE_MAX_GROWTH_BYTES: 2048
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

    steps:
      - name: Checkout PR merge commit 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || format('refs/pull/{0}/merge', github.event.pull_request.number) }}
          persist-credentials: false

      - name: Enable Corepack 📦
        run: corepack enable

      - name: Setup ⚙️ Node.js 🔰
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Install Dependencies 🥁
        run: yarn install --immutable

      - name: Test bundle size scripts
        run: node --test .github/scripts/bundle-size-scripts.test.mjs

      - name: Write comparison config
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          cp .github/scripts/compare-bundle-delta.mjs "${RUNNER_TEMP}/compare-bundle-delta.mjs"
          cp .github/scripts/merge-size-limit-config.mjs "${RUNNER_TEMP}/merge-size-limit-config.mjs"
          cp .size-limit.json "${RUNNER_TEMP}/size-limit.pr.json"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --no-tags "${SERVER_URL}/${REPOSITORY}.git" "${BASE_SHA}"
          git show "FETCH_HEAD:.size-limit.json" > "${RUNNER_TEMP}/size-limit.base.json"
          node "${RUNNER_TEMP}/merge-size-limit-config.mjs" \
            "${RUNNER_TEMP}/size-limit.base.json" \
            "${RUNNER_TEMP}/size-limit.pr.json" \
            "${RUNNER_TEMP}/size-limit.compare.json"
          cp "${RUNNER_TEMP}/size-limit.compare.json" .size-limit.ci.json

      - name: Build and measure PR bundle
        run: |
          rm -rf dist
          yarn build
          set +e
          yarn size-limit --config .size-limit.ci.json --json > "${RUNNER_TEMP}/pr-size-limit.json"
          status=$?
          set -e
          if [ ! -s "${RUNNER_TEMP}/pr-size-limit.json" ]; then
            exit "$status"
          fi

      - name: Build and measure base branch bundle
        run: |
          git checkout --force FETCH_HEAD
          yarn install --immutable
          rm -rf dist
          yarn build
          cp "${RUNNER_TEMP}/size-limit.compare.json" .size-limit.ci.json
          set +e
          yarn size-limit --config .size-limit.ci.json --json > "${RUNNER_TEMP}/base-size-limit.json"
          status=$?
          set -e
          if [ ! -s "${RUNNER_TEMP}/base-size-limit.json" ]; then
            exit "$status"
          fi

      - name: Compare bundle growth vs base
        id: size-limit
        run: |
          node "${RUNNER_TEMP}/compare-bundle-delta.mjs" \
            "${RUNNER_TEMP}/base-size-limit.json" \
            "${RUNNER_TEMP}/pr-size-limit.json" \
            --config "${RUNNER_TEMP}/size-limit.compare.json" \
            --base-config "${RUNNER_TEMP}/size-limit.base.json" \
            --pr-config "${RUNNER_TEMP}/size-limit.pr.json" \
            --max-bytes "${BUNDLE_MAX_GROWTH_BYTES}" \
            --output bundle-size-delta.json

      - name: Upload bundle size results
        if: failure() && steps.size-limit.outcome == 'failure'
        run: |
          staging="${RUNNER_TEMP}/size-limit-log"
          mkdir -p "${staging}"
          cp bundle-size-delta.json "${staging}/"
          cp "${RUNNER_TEMP}/base-size-limit.json" "${staging}/"
          cp "${RUNNER_TEMP}/pr-size-limit.json" "${staging}/"
      - name: Upload size-limit-log artifact
        if: failure() && steps.size-limit.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: size-limit-log
          path: ${{ runner.temp }}/size-limit-log

  # Unit tests — sharded across 2 runners for parallel execution
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack 📦
        run: corepack enable

      - name: Setup ⚙️ Node.js 🔰
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Install Dependencies 🥁
        run: yarn install --immutable

      - name: Run unit tests 🧪 (shard ${{ matrix.shard }}/2)
        run: yarn test --maxWorkers=2 --coverage --silent --ci --verbose=false --shard=${{ matrix.shard }}/2
        env:
          CI: true

      - name: Test local CLI authentication helpers
        if: matrix.shard == 1
        run: yarn test:dev-auth

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: shard-${{ matrix.shard }}
          fail_ci_if_error: true
