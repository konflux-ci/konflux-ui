name: 'Generate error log'

runs:
  using: "composite"
  steps:
    - name: Generate error logs
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        # Cleanup runs after a failed test. Do not keep the job secrets for it.
        unset CYPRESS_GH_TOKEN GH_APP_ID GH_APP_PRIVATE_KEY GH_APP_WEBHOOK_SECRET \
          QUAY_TEST_ORG QUAY_TOKEN_TEST SMEE_URL CYPRESS_USERNAME CYPRESS_PASSWORD \
          CYPRESS_PROJECT_ID CYPRESS_RECORD_KEY CODECOV_TOKEN
        : Generate error logs
        # This file is not present for periodic-stage jobs as we don't deploy Konflux
        if [ -f ./konflux-ci/generate-err-logs.sh ]; then
          ./konflux-ci/generate-err-logs.sh
        fi
      shell: bash

    - name: Copy UI E2E test logs
      if: ${{ !cancelled() }}
      run: |
        unset CYPRESS_GH_TOKEN GH_APP_ID GH_APP_PRIVATE_KEY GH_APP_WEBHOOK_SECRET \
          QUAY_TEST_ORG QUAY_TOKEN_TEST SMEE_URL CYPRESS_USERNAME CYPRESS_PASSWORD \
          CYPRESS_PROJECT_ID CYPRESS_RECORD_KEY CODECOV_TOKEN
        mkdir -p logs
        if [ -d artifacts ]; then cp -r artifacts/* logs/ || true; fi
      shell: bash

    - name: Archive logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: logs
        path: logs
