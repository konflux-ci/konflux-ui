apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-e2e-konflux-ui
  annotations:
    tekton.dev/displayName: 'konflux-ui-e2e-tests'
    tekton.dev/categories: 'Pipeline'
    tekton.dev/tags: 'e2e,cypress,konflux-ui'
spec:
  description: >-
    Runs E2E tests for Konflux UI and pushes test artifacts to OCI repository.
  params:
    - name: job-type
      type: string
      default: 'pr-check'
    - name: test-image
      type: string
      description: >-
        E2E test image built by the ui pipeline for this revision
        (repository:on-pr-<sha> for pr-check).
    - name: cypress-credentials-secret
      type: string
      default: 'cypress-credentials'
    - name: cypress-cloud-secret
      type: string
      default: 'cypress-cloud-credentials'
    - name: github-credentials-secret
      type: string
      default: 'github-credentials'
    - name: spec-file
      type: string
      default: 'tests/component-lifecycle.spec.ts,tests/environment-config.spec.ts'
    - name: enable-coverage
      type: string
      default: 'true'
      description: >-
        When true (and job-type is not periodic-stage), run Cypress with
        cy:run:coverage, archive .nyc_output, and upload to Codecov when a
        token is available.
    - name: codecov-credentials-secret
      type: string
      default: 'codecov-credentials'
      description: 'Secret with Codecov token (key: token). Upload skipped if missing.'
    - name: oci-ref
      type: string
      description: 'OCI repository to store test artifacts'
    - name: oci-credentials
      type: string
      default: 'quay-secret'
      description: 'Secret name for OCI registry authentication'
    - name: source-repo-url
      type: string
      default: ''
      description: 'Git URL of the PR source repo, from test-metadata'
    - name: git-revision
      type: string
      default: ''
      description: 'PR head commit SHA, from test-metadata'
    - name: target-branch
      type: string
      default: ''
      description: 'PR target branch (e.g. main), from test-metadata'
    - name: target-repo-url
      type: string
      default: ''
      description: 'Upstream Git URL (git-org/git-repo). Required for fork -> upstream PR overlay.'
    - name: pipeline-run-name
      type: string
      description: 'Integration pipeline run name; used to locate the Kind kubeconfig secret.'
  volumes:
    # Enlarge /dev/shm for Cypress/Chrome; default container shm (~64MB) causes flaky browser crashes
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 3Gi
    - name: test-artifacts
      emptyDir: {}
    - name: e2e-overlay
      emptyDir: {}
    - name: oci-credentials
      secret:
        secretName: $(params.oci-credentials)
        optional: true
        items:
          - key: oci-storage-dockerconfigjson
            path: oci-storage-dockerconfigjson
    - name: codecov-credentials
      secret:
        secretName: $(params.codecov-credentials-secret)
        optional: true
  stepTemplate:
    volumeMounts:
      - name: test-artifacts
        mountPath: /artifacts
  steps:
    - name: retrieve-local-url
      results:
        - name: base-url
          description: 'Konflux base URL for Cypress tests (https://<kind-ip>:9443)'
      image: quay.io/konflux-ci/tekton-integration-catalog/utils@sha256:79707a56aa34a59f8ebb97db855114b840cbbf60bece4a0edf8ef8c7d7d5acd1
      env:
        - name: TEKTON_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [ "$(params.job-type)" = "periodic-stage" ]; then
          echo "Skipping Kind cluster setup for periodic-stage"
          : > "$(step.results.base-url.path)"
          exit 0
        fi

        echo "=== Getting PipelineRun name and kubeconfig ==="

        # Passed from the Pipeline (resolved at PipelineRun level).
        PIPELINE_RUN_NAME="$(params.pipeline-run-name)"
        NAMESPACE="${TEKTON_NAMESPACE}"
        echo "PipelineRun name: ${PIPELINE_RUN_NAME}"
        echo "Namespace: ${NAMESPACE}"

        if [[ -z "${PIPELINE_RUN_NAME}" ]]; then
          echo "ERROR: pipeline-run-name param is empty"
          exit 1
        fi

        # Construct the secret name
        SECRET_NAME="kfg-${PIPELINE_RUN_NAME}"
        echo "Looking for secret: ${SECRET_NAME}"

        # Extract kubeconfig from the secret (0600 so it is not world-readable)
        kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.kubeconfig}' \
          | base64 -d \
          | install -m 0600 /dev/stdin /tmp/kubeconfig

        # Switch to Kind cluster context
        export KUBECONFIG=/tmp/kubeconfig

        echo "=== Extracting Konflux base URL from kubeconfig ==="

        KUBE_SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
        echo "Kubernetes API server: ${KUBE_SERVER}"

        # Extract IP address (remove https:// prefix and :6443 port)
        KUBE_IP=$(echo "${KUBE_SERVER}" | sed -E 's|https?://([^:]+):.*|\1|')
        echo "Extracted IP: ${KUBE_IP}"

        CYPRESS_KONFLUX_BASE_URL="https://${KUBE_IP}:9443"
        echo "Konflux base URL: ${CYPRESS_KONFLUX_BASE_URL}"

        echo -n "${CYPRESS_KONFLUX_BASE_URL}" > "$(step.results.base-url.path)"

        echo "Setup complete. Ready for E2E tests."

    - name: prepare-e2e-sources
      when:
        - input: '$(params.job-type)'
          operator: in
          values: ['pr-check']
      image: quay.io/konflux-qe-incubator/konflux-qe-tools@sha256:88d70f9c61d2059e3a084fe6f2fb3ac341bc65efe9c6ba994e42a61bbb54fcba
      volumeMounts:
        - name: e2e-overlay
          mountPath: /e2e
      env:
        - name: GIT_TERMINAL_PROMPT
          value: '0'
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        SOURCE_REPO_URL="$(params.source-repo-url)"
        TARGET_REPO_URL="$(params.target-repo-url)"
        GIT_REVISION="$(params.git-revision)"
        TARGET_BRANCH="$(params.target-branch)"
        TARGET_BRANCH="${TARGET_BRANCH#refs/heads/}"

        echo "=== Checking for e2e-tests/ changes (pr-check) ==="
        echo "Source repo: ${SOURCE_REPO_URL}"
        echo "Target repo: ${TARGET_REPO_URL}"
        echo "PR revision: ${GIT_REVISION}"
        echo "Target branch: ${TARGET_BRANCH}"

        # PR overlay applies only to fork -> upstream PRs (same as pr_check scope on konflux-ci/konflux-ui).
        if [ "${SOURCE_REPO_URL}" = "${TARGET_REPO_URL}" ]; then
          echo "Same-repo PR — skipping e2e overlay, run-e2e will use image sources"
          exit 0
        fi

        git config --global init.defaultBranch main
        git init /tmp/repo
        cd /tmp/repo
        git remote add origin "${SOURCE_REPO_URL}"

        echo "Fetching PR revision ${GIT_REVISION} from fork..."
        git fetch --depth=1 origin "${GIT_REVISION}"
        git remote add upstream "${TARGET_REPO_URL}"
        echo "Fetching upstream/${TARGET_BRANCH}..."
        git fetch --depth=1 upstream \
          "refs/heads/${TARGET_BRANCH}:refs/remotes/upstream/${TARGET_BRANCH}"
        echo "Fetch complete"

        if git diff --quiet "upstream/${TARGET_BRANCH}" "${GIT_REVISION}" -- e2e-tests/; then
          echo "No e2e-tests/ changes detected — run-e2e will use image sources"
          exit 0
        fi

        echo "e2e-tests/ changed — staging PR sources at /e2e"
        git checkout "${GIT_REVISION}" -- e2e-tests/
        cp -a e2e-tests/. /e2e/

        # run-e2e-test runs as non-root (OpenShift arbitrary UID); root-owned files block yarn install.
        chmod -R a+rwX /e2e

        echo "Staged $(find /e2e -type f | wc -l) files under /e2e"

    - name: run-e2e-test
      image: $(params.test-image)
      onError: continue
      workingDir: /tmp/e2e
      # Temporary resource sampler (KFLUXUI-1500) writes /artifacts/resource-usage.json.
      # Update these from collected peaks, then remove the sampler block in the script.
      # workingDir is set dynamically in the script: /e2e when PR sources are staged, /tmp/e2e otherwise.
      computeResources:
        limits:
          memory: 8Gi
          cpu: '2'
        requests:
          memory: 8Gi
          cpu: '1'
      volumeMounts:
        # Mount the dshm (shared memory) volume at /dev/shm for UI end-to-end (E2E) tests.
        # Chromium-based browsers (such as Cypress and Playwright) require /dev/shm for reliable operation inside containers.
        - name: dshm
          mountPath: /dev/shm
        - name: e2e-overlay
          mountPath: /e2e
      env:
        - name: CYPRESS_USERNAME
          valueFrom:
            secretKeyRef:
              name: $(params.cypress-credentials-secret)
              key: username
        - name: CYPRESS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.cypress-credentials-secret)
              key: password
        - name: CYPRESS_GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.github-credentials-secret)
              key: token
        - name: CYPRESS_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: $(params.cypress-cloud-secret)
              key: project-id
        - name: CYPRESS_RECORD_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.cypress-cloud-secret)
              key: record-key
        - name: LOCAL_KONFLUX_BASE_URL
          value: $(steps.retrieve-local-url.results.base-url)
      script: |
        #!/usr/bin/env bash
        # Note: NOT using 'set -e' so script continues after test failure
        set -uo pipefail

        echo "=== Loading configuration ==="

        if [ "$(params.job-type)" = "periodic-stage" ]; then
          export CYPRESS_KONFLUX_BASE_URL="https://konflux-ui.apps.stone-stg-rh01.l2vh.p1.openshiftapps.com"
          export CYPRESS_LOCAL_CLUSTER=false
          export CYPRESS_PERIODIC_RUN_STAGE=true
        else
          if [ -z "${LOCAL_KONFLUX_BASE_URL}" ]; then
            echo "ERROR: LOCAL_KONFLUX_BASE_URL is missing or empty (retrieve-local-url step failed?)"
            exit 1
          fi
          export CYPRESS_KONFLUX_BASE_URL="${LOCAL_KONFLUX_BASE_URL}"
          export CYPRESS_LOCAL_CLUSTER=true
          export CYPRESS_HAC_NAMESPACE=user-ns2
        fi
        echo "Konflux base URL: ${CYPRESS_KONFLUX_BASE_URL}"

        echo "=== Selecting E2E test sources ==="
        SPEC_FILE="$(params.spec-file)"

        # prepare-e2e-sources stages PR e2e-tests/ at /e2e when the folder changed; otherwise /e2e stays empty.
        if [ -n "$(ls -A /e2e 2>/dev/null)" ]; then
          echo "PR e2e sources detected at /e2e — installing dependencies"
          cd /e2e
          yarn install --immutable || { echo 'ERROR: yarn install failed'; exit 1; }
          yarn cypress install
          E2E_DIR=/e2e
        else
          echo "No PR e2e overlay — using image-baked sources at /tmp/e2e"
          cd /tmp/e2e
          E2E_DIR=/tmp/e2e
        fi

        echo "=== Running E2E tests ==="
        echo "Working directory: ${E2E_DIR}"
        echo "Running test spec: ${SPEC_FILE}"

        # --- Temporary (KFLUXUI-1500): sample container CPU/memory while tests run ---
        # Remove this block after collecting stats and updating computeResources.
        mkdir -p /artifacts
        SAMPLE_INTERVAL_S=5
        SAMPLES_FILE=/tmp/resource-usage-samples.txt
        : > "${SAMPLES_FILE}"

        resolve_cgroup_dir() {
          if [ -f /sys/fs/cgroup/memory.current ]; then
            echo /sys/fs/cgroup
            return
          fi
          local rel
          rel=$(awk -F: 'END { print $3 }' /proc/self/cgroup 2>/dev/null || true)
          if [ -n "${rel}" ] && [ -f "/sys/fs/cgroup${rel}/memory.current" ]; then
            echo "/sys/fs/cgroup${rel}"
            return
          fi
          echo ""
        }

        CGROUP_DIR=$(resolve_cgroup_dir)
        SAMPLER_PID=""
        if [ -n "${CGROUP_DIR}" ]; then
          echo "Resource sampler: cgroup dir=${CGROUP_DIR}, interval=${SAMPLE_INTERVAL_S}s"
          (
            while true; do
              mem=$(cat "${CGROUP_DIR}/memory.current" 2>/dev/null || echo 0)
              cpu_us=$(awk '/^usage_usec / { print $2 }' "${CGROUP_DIR}/cpu.stat" 2>/dev/null || echo 0)
              throttled_us=$(awk '/^throttled_usec / { print $2 }' "${CGROUP_DIR}/cpu.stat" 2>/dev/null || echo 0)
              echo "$(date +%s) ${mem} ${cpu_us} ${throttled_us}"
              sleep "${SAMPLE_INTERVAL_S}"
            done
          ) > "${SAMPLES_FILE}" &
          SAMPLER_PID=$!
        else
          echo "Resource sampler: cgroup metrics unavailable; skipping"
        fi

        write_resource_usage_summary() {
          local out=/artifacts/resource-usage.json
          local started_at="$1"
          local ended_at="$2"
          local duration_s="$3"

          if [ ! -s "${SAMPLES_FILE}" ]; then
            printf '%s\n' \
              '{' \
              "  \"job_type\": \"$(params.job-type)\"," \
              "  \"spec_file\": \"${SPEC_FILE}\"," \
              "  \"started_at\": \"${started_at}\"," \
              "  \"ended_at\": \"${ended_at}\"," \
              "  \"duration_s\": ${duration_s}," \
              "  \"sample_interval_s\": ${SAMPLE_INTERVAL_S}," \
              '  "limits": { "memory": "8Gi", "cpu": "2" },' \
              '  "requests": { "memory": "8Gi", "cpu": "1" },' \
              '  "error": "no samples collected"' \
              '}' > "${out}"
            return
          fi

          awk -v started_at="${started_at}" -v ended_at="${ended_at}" -v duration_s="${duration_s}" \
              -v interval="${SAMPLE_INTERVAL_S}" -v job_type="$(params.job-type)" -v spec_file="${SPEC_FILE}" '
          BEGIN {
            peak_mem = 0; sum_mem = 0; n = 0
            peak_cpu = 0; sum_cpu = 0; cpu_n = 0
            prev_ts = 0; prev_cpu = 0
            first = 1
            first_thr = -1
            last_thr = 0
          }
          {
            ts = $1 + 0; mem = $2 + 0; cpu = $3 + 0; thr = $4 + 0
            n++
            sum_mem += mem
            if (mem > peak_mem) peak_mem = mem
            if (!first) {
              dt = ts - prev_ts
              if (dt > 0) {
                cores = ((cpu - prev_cpu) / 1000000) / dt
                if (cores < 0) cores = 0
                sum_cpu += cores
                cpu_n++
                if (cores > peak_cpu) peak_cpu = cores
              }
            }
            if (first_thr < 0) first_thr = thr
            last_thr = thr
            prev_ts = ts; prev_cpu = cpu
            first = 0
          }
          END {
            avg_mem = (n > 0) ? sum_mem / n : 0
            avg_cpu = (cpu_n > 0) ? sum_cpu / cpu_n : 0
            thr_delta = last_thr - first_thr
            if (thr_delta < 0) thr_delta = 0
            thr_pct = (duration_s > 0) ? (thr_delta / 1000000) / duration_s * 100 : 0
            printf "{\n"
            printf "  \"job_type\": \"%s\",\n", job_type
            printf "  \"spec_file\": \"%s\",\n", spec_file
            printf "  \"started_at\": \"%s\",\n", started_at
            printf "  \"ended_at\": \"%s\",\n", ended_at
            printf "  \"duration_s\": %d,\n", duration_s
            printf "  \"sample_interval_s\": %d,\n", interval
            printf "  \"sample_count\": %d,\n", n
            printf "  \"limits\": { \"memory\": \"8Gi\", \"cpu\": \"2\" },\n"
            printf "  \"requests\": { \"memory\": \"8Gi\", \"cpu\": \"1\" },\n"
            printf "  \"memory\": {\n"
            printf "    \"peak_bytes\": %.0f,\n", peak_mem
            printf "    \"avg_bytes\": %.0f,\n", avg_mem
            printf "    \"peak_mi\": %.1f,\n", peak_mem / 1024 / 1024
            printf "    \"avg_mi\": %.1f\n", avg_mem / 1024 / 1024
            printf "  },\n"
            printf "  \"cpu\": {\n"
            printf "    \"avg_cores\": %.3f,\n", avg_cpu
            printf "    \"peak_cores\": %.3f,\n", peak_cpu
            printf "    \"throttled_pct\": %.2f\n", thr_pct
            printf "  }\n"
            printf "}\n"
          }
          ' "${SAMPLES_FILE}" > "${out}"
        }

        STARTED_EPOCH=$(date +%s)
        STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        # KEEP
        ENABLE_COVERAGE="$(params.enable-coverage)"
        if [ "$(params.job-type)" = "periodic-stage" ]; then
          ENABLE_COVERAGE="false"
        fi
        echo "Coverage collection: ${ENABLE_COVERAGE}"

        # Run tests and capture exit code (don't exit on failure)
        set +e
        if [ "${ENABLE_COVERAGE}" = "true" ]; then
          yarn run cy:run:coverage --spec "${SPEC_FILE}"
        else
          yarn run cy:run --spec "${SPEC_FILE}"
        fi
        TEST_RESULT=$?

        # KEEP END

        ENDED_EPOCH=$(date +%s)
        ENDED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        DURATION_S=$((ENDED_EPOCH - STARTED_EPOCH))

        if [ -n "${SAMPLER_PID}" ]; then
          kill "${SAMPLER_PID}" 2>/dev/null
          wait "${SAMPLER_PID}" 2>/dev/null
        fi
        write_resource_usage_summary "${STARTED_AT}" "${ENDED_AT}" "${DURATION_S}"
        echo "Wrote /artifacts/resource-usage.json"
        cat /artifacts/resource-usage.json
        # --- end KFLUXUI-1500 temporary sampler ---
        set -e

        echo ""
        echo "=========================================="
        echo "Test completed with exit code: ${TEST_RESULT}"
        echo "=========================================="
        echo ""

        echo "=== Collecting test artifacts ==="
        mkdir -p /artifacts

        # Copy Cypress artifacts from whichever source tree was used for the run
        if [ -d "${E2E_DIR}/cypress/videos" ]; then
          echo "Copying videos..."
          cp -r "${E2E_DIR}/cypress/videos" /artifacts/ || true
        fi

        if [ -d "${E2E_DIR}/cypress/screenshots" ]; then
          echo "Copying screenshots..."
          cp -r "${E2E_DIR}/cypress/screenshots" /artifacts/ || true
        fi

        # Copy test reports
        for f in "${E2E_DIR}"/cypress/junit-*.xml; do
          if [ -f "$f" ]; then
            echo "Copying JUnit report: $f"
            cp "$f" /artifacts/ || true
          fi
        done

        # Copy Istanbul coverage output for Codecov / OCI artifacts
        if [ -d "${E2E_DIR}/.nyc_output" ]; then
          echo "Copying coverage data from ${E2E_DIR}/.nyc_output..."
          cp -a "${E2E_DIR}/.nyc_output" /artifacts/ || true
        else
          echo "No .nyc_output directory found under ${E2E_DIR}"
        fi

        # Create a simple test log
        echo "Test execution completed with exit code: ${TEST_RESULT}" > /artifacts/e2e-tests.log
        echo "Timestamp: $(date)" >> /artifacts/e2e-tests.log
        echo "Base URL: ${CYPRESS_KONFLUX_BASE_URL}" >> /artifacts/e2e-tests.log
        echo "Coverage enabled: ${ENABLE_COVERAGE}" >> /artifacts/e2e-tests.log

        # Save test result for later steps
        echo "${TEST_RESULT}" > /artifacts/test-exit-code
        echo "${ENABLE_COVERAGE}" > /artifacts/coverage-enabled

        # List collected artifacts
        echo "Artifacts collected:"
        ls -lah /artifacts/


        # Now exit with the test result
        echo ""
        echo "=== Final Result ==="
        if [ ${TEST_RESULT} -ne 0 ]; then
          echo "❌ E2E tests failed with exit code: ${TEST_RESULT}"
          exit ${TEST_RESULT}
        else
          echo "✅ E2E tests passed"
          exit 0
        fi

    - name: upload-coverage
      onError: continue
      image: quay.io/konflux-ci/konflux-devprod/coverport-cli@sha256:bd8dc5b1048d3385d77a17954638e1b8ae1ac2236a65560612e535e5d0888e27
      env:
        - name: CODECOV_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.codecov-credentials-secret)
              key: token
              optional: true
        - name: SOURCE_REPO_URL
          value: $(params.source-repo-url)
        - name: GIT_REVISION
          value: $(params.git-revision)
        - name: TARGET_REPO_URL
          value: $(params.target-repo-url)
      volumeMounts:
        - name: codecov-credentials
          mountPath: /codecov-credentials
          readOnly: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [ "$(params.enable-coverage)" != "true" ] || [ "$(params.job-type)" = "periodic-stage" ]; then
          echo "Coverage upload skipped (enable-coverage=$(params.enable-coverage), job-type=$(params.job-type))"
          exit 0
        fi

        COVERAGE_DIR="/artifacts/.nyc_output"
        if [ ! -d "${COVERAGE_DIR}" ] || [ ! -f "${COVERAGE_DIR}/out.json" ]; then
          echo "No coverage data at ${COVERAGE_DIR}/out.json — skipping Codecov upload"
          exit 0
        fi

        if [ -z "${CODECOV_TOKEN:-}" ] && [ -f /codecov-credentials/token ]; then
          CODECOV_TOKEN="$(cat /codecov-credentials/token)"
          export CODECOV_TOKEN
        fi

        if [ -z "${CODECOV_TOKEN:-}" ]; then
          echo "CODECOV_TOKEN not available — skipping Codecov upload"
          exit 0
        fi

        REPO_URL="${TARGET_REPO_URL:-${SOURCE_REPO_URL}}"
        COMMIT_SHA="${GIT_REVISION}"
        if [ -z "${REPO_URL}" ] || [ -z "${COMMIT_SHA}" ]; then
          echo "Missing repo URL or commit SHA — skipping Codecov upload"
          exit 0
        fi

        echo "=== Uploading e2e coverage to Codecov ==="
        echo "Repository: ${REPO_URL}"
        echo "Commit SHA: ${COMMIT_SHA}"

        COVERPORT_BIN="$(command -v coverport || true)"
        if [ -z "${COVERPORT_BIN}" ]; then
          for candidate in /usr/local/bin/coverport /usr/bin/coverport /bin/coverport; do
            if [ -x "${candidate}" ]; then
              COVERPORT_BIN="${candidate}"
              break
            fi
          done
        fi
        if [ -z "${COVERPORT_BIN}" ]; then
          echo "ERROR: coverport binary not found in image"
          exit 1
        fi

        mkdir -p /artifacts/coverport-output
        "${COVERPORT_BIN}" process \
          --coverage-dir="${COVERAGE_DIR}" \
          --format=nyc \
          --repo-url="${REPO_URL}" \
          --commit-sha="${COMMIT_SHA}" \
          --workspace=/artifacts/coverport-output \
          --codecov-flags=e2e \
          --keep-workspace

        echo "✅ Coverage uploaded to Codecov"

    - name: secure-push-oci
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/secure-push-oci/0.2/secure-push-oci.yaml
      params:
        - name: workdir-path
          value: /artifacts
        - name: oci-ref
          value: $(params.oci-ref)
        - name: credentials-volume-name
          value: oci-credentials
        - name: credentials-volume-key
          value: oci-storage-dockerconfigjson

    - name: fail-if-any-step-failed
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/fail-if-any-step-failed/0.1/fail-if-any-step-failed.yaml
