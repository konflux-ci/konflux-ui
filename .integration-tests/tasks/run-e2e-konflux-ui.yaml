apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-e2e-konflux-ui
  annotations:
    tekton.dev/displayName: 'konflux-ui-e2e-tests'
    tekton.dev/categories: 'Pipeline'
    tekton.dev/tags: 'e2e,cypress,konflux-ui'
spec:
  description: >-
    Runs E2E tests for Konflux UI and pushes test artifacts to OCI repository.
  params:
    - name: job-type
      type: string
      default: 'pr-check'
    - name: test-image-tag
      type: string
      default: 'latest'
      description: >-
        Tag for the E2E test image (quay.io/konflux_ui_qe/konflux-ui-tests:<tag>).
        Repository is fixed so PipelineRuns cannot point the secret-bearing step at an arbitrary image.
    - name: cypress-credentials-secret
      type: string
      default: 'cypress-credentials'
    - name: cypress-cloud-secret
      type: string
      default: 'cypress-cloud-credentials'
    - name: github-credentials-secret
      type: string
      default: 'github-credentials'
    - name: spec-file
      type: string
      default: 'tests/basic-happy-path.spec.ts'
    - name: oci-ref
      type: string
      description: 'OCI repository to store test artifacts'
    - name: oci-credentials
      type: string
      default: 'quay-secret'
      description: 'Secret name for OCI registry authentication'
  volumes:
    # Enlarge /dev/shm for Cypress/Chrome; default container shm (~64MB) causes flaky browser crashes
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 3Gi
    - name: kubeconfig-data
      emptyDir: {}
    - name: test-artifacts
      emptyDir: {}
    - name: oci-credentials
      secret:
        secretName: $(params.oci-credentials)
        optional: true
        items:
          - key: oci-storage-dockerconfigjson
            path: oci-storage-dockerconfigjson
  stepTemplate:
    volumeMounts:
      - name: test-artifacts
        mountPath: /artifacts
  steps:
    - name: setup-base-url
      when:
        - input: '$(params.job-type)'
          operator: notin
          values: ['periodic-stage']
      image: docker.io/bitnami/kubectl@sha256:95de17e6eb92da83a58c90a9df0c4cede634f898d2e6b92ea04f4a6ee6ace08d # kubectl 1.36.3
      volumeMounts:
        - name: kubeconfig-data
          mountPath: /shared
      env:
        - name: TEKTON_PIPELINE_RUN
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tekton.dev/pipelineRun']
        - name: TEKTON_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "=== Getting PipelineRun name and kubeconfig ==="

        # Get PipelineRun name and namespace from environment variables set by Tekton
        PIPELINE_RUN_NAME="${TEKTON_PIPELINE_RUN}"
        NAMESPACE="${TEKTON_NAMESPACE}"
        echo "PipelineRun name: ${PIPELINE_RUN_NAME}"
        echo "Namespace: ${NAMESPACE}"

        # Construct the secret name
        SECRET_NAME="kfg-${PIPELINE_RUN_NAME}"
        echo "Looking for secret: ${SECRET_NAME}"

        # Extract kubeconfig from the secret (0600 so it is not world-readable)
        kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.kubeconfig}' \
          | base64 -d \
          | install -m 0600 /dev/stdin /shared/kubeconfig

        # Switch to Kind cluster context
        export KUBECONFIG=/shared/kubeconfig

        echo "=== Extracting Konflux base URL from kubeconfig ==="

        KUBE_SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
        echo "Kubernetes API server: ${KUBE_SERVER}"

        # Extract IP address (remove https:// prefix and :6443 port)
        KUBE_IP=$(echo "${KUBE_SERVER}" | sed -E 's|https?://([^:]+):.*|\1|')
        echo "Extracted IP: ${KUBE_IP}"

        CYPRESS_KONFLUX_BASE_URL="https://${KUBE_IP}:9443"
        echo "Konflux base URL: ${CYPRESS_KONFLUX_BASE_URL}"

        # Save to shared volume for next step
        echo "${CYPRESS_KONFLUX_BASE_URL}" > /shared/base-url

        echo "Setup complete. Ready for E2E tests."

    - name: run-e2e-test
      image: quay.io/konflux_ui_qe/konflux-ui-tests:$(params.test-image-tag)
      onError: continue
      workingDir: /tmp/e2e
      # Temporary resource sampler (KFLUXUI-1500) writes /artifacts/resource-usage.json.
      # Update these from collected peaks, then remove the sampler block in the script.
      computeResources:
        limits:
          memory: 8Gi
          cpu: '2'
        requests:
          memory: 8Gi
          cpu: '1'
      volumeMounts:
        # Mount the dshm (shared memory) volume at /dev/shm for UI end-to-end (E2E) tests.
        # Chromium-based browsers (such as Cypress and Playwright) require /dev/shm for reliable operation inside containers.
        - name: dshm
          mountPath: /dev/shm
        - name: kubeconfig-data
          mountPath: /shared
          readOnly: true
      env:
        - name: CYPRESS_USERNAME
          valueFrom:
            secretKeyRef:
              name: $(params.cypress-credentials-secret)
              key: username
        - name: CYPRESS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.cypress-credentials-secret)
              key: password
        - name: CYPRESS_GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.github-credentials-secret)
              key: token
        - name: CYPRESS_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: $(params.cypress-cloud-secret)
              key: project-id
        - name: CYPRESS_RECORD_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.cypress-cloud-secret)
              key: record-key
      script: |
        #!/usr/bin/env bash
        # Note: NOT using 'set -e' so script continues after test failure
        set -uo pipefail

        echo "=== Loading configuration from setup step ==="

        # Read base URL from shared volume
        if [ "$(params.job-type)" = "periodic-stage" ]; then
          export CYPRESS_KONFLUX_BASE_URL="https://konflux-ui.apps.stone-stg-rh01.l2vh.p1.openshiftapps.com"
          export CYPRESS_LOCAL_CLUSTER=false
          export CYPRESS_PERIODIC_RUN_STAGE=true
        else
          if [ ! -s /shared/base-url ]; then
            echo "ERROR: /shared/base-url is missing or empty (setup-base-url step failed?)"
            ls -la /shared/ || true
            exit 1
          fi
          export CYPRESS_KONFLUX_BASE_URL=$(cat /shared/base-url)
          export CYPRESS_LOCAL_CLUSTER=true
        fi
        echo "Konflux base URL: ${CYPRESS_KONFLUX_BASE_URL}"

        echo "=== Running E2E tests ==="
        SPEC_FILE="$(params.spec-file)"

        echo "Running test spec: ${SPEC_FILE}"

        # --- Temporary (KFLUXUI-1500): sample container CPU/memory while tests run ---
        # Remove this block after collecting stats and updating computeResources.
        mkdir -p /artifacts
        SAMPLE_INTERVAL_S=5
        SAMPLES_FILE=/tmp/resource-usage-samples.txt
        : > "${SAMPLES_FILE}"

        resolve_cgroup_dir() {
          if [ -f /sys/fs/cgroup/memory.current ]; then
            echo /sys/fs/cgroup
            return
          fi
          local rel
          rel=$(awk -F: 'END { print $3 }' /proc/self/cgroup 2>/dev/null || true)
          if [ -n "${rel}" ] && [ -f "/sys/fs/cgroup${rel}/memory.current" ]; then
            echo "/sys/fs/cgroup${rel}"
            return
          fi
          echo ""
        }

        CGROUP_DIR=$(resolve_cgroup_dir)
        SAMPLER_PID=""
        if [ -n "${CGROUP_DIR}" ]; then
          echo "Resource sampler: cgroup dir=${CGROUP_DIR}, interval=${SAMPLE_INTERVAL_S}s"
          (
            while true; do
              mem=$(cat "${CGROUP_DIR}/memory.current" 2>/dev/null || echo 0)
              cpu_us=$(awk '/^usage_usec / { print $2 }' "${CGROUP_DIR}/cpu.stat" 2>/dev/null || echo 0)
              throttled_us=$(awk '/^throttled_usec / { print $2 }' "${CGROUP_DIR}/cpu.stat" 2>/dev/null || echo 0)
              echo "$(date +%s) ${mem} ${cpu_us} ${throttled_us}"
              sleep "${SAMPLE_INTERVAL_S}"
            done
          ) > "${SAMPLES_FILE}" &
          SAMPLER_PID=$!
        else
          echo "Resource sampler: cgroup metrics unavailable; skipping"
        fi

        write_resource_usage_summary() {
          local out=/artifacts/resource-usage.json
          local started_at="$1"
          local ended_at="$2"
          local duration_s="$3"

          if [ ! -s "${SAMPLES_FILE}" ]; then
            printf '%s\n' \
              '{' \
              "  \"job_type\": \"$(params.job-type)\"," \
              "  \"spec_file\": \"${SPEC_FILE}\"," \
              "  \"started_at\": \"${started_at}\"," \
              "  \"ended_at\": \"${ended_at}\"," \
              "  \"duration_s\": ${duration_s}," \
              "  \"sample_interval_s\": ${SAMPLE_INTERVAL_S}," \
              '  "limits": { "memory": "8Gi", "cpu": "2" },' \
              '  "requests": { "memory": "8Gi", "cpu": "1" },' \
              '  "error": "no samples collected"' \
              '}' > "${out}"
            return
          fi

          awk -v started_at="${started_at}" -v ended_at="${ended_at}" -v duration_s="${duration_s}" \
              -v interval="${SAMPLE_INTERVAL_S}" -v job_type="$(params.job-type)" -v spec_file="${SPEC_FILE}" '
          BEGIN {
            peak_mem = 0; sum_mem = 0; n = 0
            peak_cpu = 0; sum_cpu = 0; cpu_n = 0
            prev_ts = 0; prev_cpu = 0
            first = 1
            first_thr = -1
            last_thr = 0
          }
          {
            ts = $1 + 0; mem = $2 + 0; cpu = $3 + 0; thr = $4 + 0
            n++
            sum_mem += mem
            if (mem > peak_mem) peak_mem = mem
            if (!first) {
              dt = ts - prev_ts
              if (dt > 0) {
                cores = ((cpu - prev_cpu) / 1000000) / dt
                if (cores < 0) cores = 0
                sum_cpu += cores
                cpu_n++
                if (cores > peak_cpu) peak_cpu = cores
              }
            }
            if (first_thr < 0) first_thr = thr
            last_thr = thr
            prev_ts = ts; prev_cpu = cpu
            first = 0
          }
          END {
            avg_mem = (n > 0) ? sum_mem / n : 0
            avg_cpu = (cpu_n > 0) ? sum_cpu / cpu_n : 0
            thr_delta = last_thr - first_thr
            if (thr_delta < 0) thr_delta = 0
            thr_pct = (duration_s > 0) ? (thr_delta / 1000000) / duration_s * 100 : 0
            printf "{\n"
            printf "  \"job_type\": \"%s\",\n", job_type
            printf "  \"spec_file\": \"%s\",\n", spec_file
            printf "  \"started_at\": \"%s\",\n", started_at
            printf "  \"ended_at\": \"%s\",\n", ended_at
            printf "  \"duration_s\": %d,\n", duration_s
            printf "  \"sample_interval_s\": %d,\n", interval
            printf "  \"sample_count\": %d,\n", n
            printf "  \"limits\": { \"memory\": \"8Gi\", \"cpu\": \"2\" },\n"
            printf "  \"requests\": { \"memory\": \"8Gi\", \"cpu\": \"1\" },\n"
            printf "  \"memory\": {\n"
            printf "    \"peak_bytes\": %.0f,\n", peak_mem
            printf "    \"avg_bytes\": %.0f,\n", avg_mem
            printf "    \"peak_mi\": %.1f,\n", peak_mem / 1024 / 1024
            printf "    \"avg_mi\": %.1f\n", avg_mem / 1024 / 1024
            printf "  },\n"
            printf "  \"cpu\": {\n"
            printf "    \"avg_cores\": %.3f,\n", avg_cpu
            printf "    \"peak_cores\": %.3f,\n", peak_cpu
            printf "    \"throttled_pct\": %.2f\n", thr_pct
            printf "  }\n"
            printf "}\n"
          }
          ' "${SAMPLES_FILE}" > "${out}"
        }

        STARTED_EPOCH=$(date +%s)
        STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        # Run tests and capture exit code (don't exit on failure)
        set +e
        yarn run cy:run --spec "${SPEC_FILE}"
        TEST_RESULT=$?

        ENDED_EPOCH=$(date +%s)
        ENDED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        DURATION_S=$((ENDED_EPOCH - STARTED_EPOCH))

        if [ -n "${SAMPLER_PID}" ]; then
          kill "${SAMPLER_PID}" 2>/dev/null
          wait "${SAMPLER_PID}" 2>/dev/null
        fi
        write_resource_usage_summary "${STARTED_AT}" "${ENDED_AT}" "${DURATION_S}"
        echo "Wrote /artifacts/resource-usage.json"
        cat /artifacts/resource-usage.json
        # --- end KFLUXUI-1500 temporary sampler ---
        set -e

        echo ""
        echo "=========================================="
        echo "Test completed with exit code: ${TEST_RESULT}"
        echo "=========================================="
        echo ""

        echo "=== Collecting test artifacts ==="
        mkdir -p /artifacts

        # Copy Cypress artifacts if they exist
        if [ -d "cypress/videos" ]; then
          echo "Copying videos..."
          cp -r cypress/videos /artifacts/ || true
        fi

        if [ -d "cypress/screenshots" ]; then
          echo "Copying screenshots..."
          cp -r cypress/screenshots /artifacts/ || true
        fi

        # Copy test reports
        for f in cypress/junit-*.xml; do
          if [ -f "$f" ]; then
            echo "Copying JUnit report: $f"
            cp "$f" /artifacts/ || true
          fi
        done

        # Create a simple test log
        echo "Test execution completed with exit code: ${TEST_RESULT}" > /artifacts/e2e-tests.log
        echo "Timestamp: $(date)" >> /artifacts/e2e-tests.log
        echo "Base URL: ${CYPRESS_KONFLUX_BASE_URL}" >> /artifacts/e2e-tests.log

        # Save test result for later steps
        echo "${TEST_RESULT}" > /artifacts/test-exit-code

        # List collected artifacts
        echo "Artifacts collected:"
        ls -lah /artifacts/


        # Now exit with the test result
        echo ""
        echo "=== Final Result ==="
        if [ ${TEST_RESULT} -ne 0 ]; then
          echo "❌ E2E tests failed with exit code: ${TEST_RESULT}"
          exit ${TEST_RESULT}
        else
          echo "✅ E2E tests passed"
          exit 0
        fi

    - name: secure-push-oci
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/secure-push-oci/0.2/secure-push-oci.yaml
      params:
        - name: workdir-path
          value: /artifacts
        - name: oci-ref
          value: $(params.oci-ref)
        - name: credentials-volume-name
          value: oci-credentials
        - name: credentials-volume-key
          value: oci-storage-dockerconfigjson

    - name: fail-if-any-step-failed
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/fail-if-any-step-failed/0.1/fail-if-any-step-failed.yaml
