apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-e2e-konflux-ui
  annotations:
    tekton.dev/displayName: 'konflux-ui-e2e-tests'
    tekton.dev/categories: 'Pipeline'
    tekton.dev/tags: 'e2e,cypress,konflux-ui'
spec:
  description: >-
    Runs E2E tests for Konflux UI and pushes test artifacts to OCI repository.
  params:
    - name: job-type
      type: string
      default: 'pr-check'
    - name: test-image
      type: string
      description: >-
        E2E test image built by the ui pipeline for this revision
        (…/konflux-ui:e2e-on-pr-<sha> for pr-check).
    - name: cypress-credentials-secret
      type: string
      default: 'cypress-credentials'
    - name: cypress-cloud-secret
      type: string
      default: 'cypress-cloud-credentials'
    - name: github-credentials-secret
      type: string
      default: 'github-credentials'
    - name: spec-file
      type: string
      default: 'tests/component-lifecycle.spec.ts,tests/environment-config.spec.ts'
    - name: enable-coverage
      type: string
      default: 'true'
      description: >-
        When true (and job-type is not periodic-stage), run Cypress with
        cy:run:coverage, archive .nyc_output, and upload to Codecov when a
        token is available.
    - name: codecov-credentials-secret
      type: string
      default: 'codecov-credentials'
      description: 'Secret with Codecov token (key: token). Upload skipped if missing.'
    - name: oci-ref
      type: string
      description: 'OCI repository to store test artifacts'
    - name: oci-credentials
      type: string
      default: 'quay-secret'
      description: 'Secret name for OCI registry authentication'
    - name: source-repo-url
      type: string
      default: ''
      description: 'Git URL of the PR source repo, from test-metadata (Codecov attribution)'
    - name: git-revision
      type: string
      default: ''
      description: 'PR head commit SHA, from test-metadata (Codecov + Cypress Cloud)'
    - name: commit-info-branch
      type: string
      default: ''
      description: 'Source branch for Cypress Cloud (COMMIT_INFO_BRANCH), from test-metadata'
    - name: pull-request-number
      type: string
      default: '0'
      description: 'PR number from test-metadata (0 for push/periodic)'
    - name: commit-info-author
      type: string
      default: ''
      description: 'PR author for Cypress Cloud (COMMIT_INFO_AUTHOR), from test-metadata'
    - name: target-repo-url
      type: string
      default: ''
      description: 'Upstream Git URL (git-org/git-repo). Used for Codecov repo attribution.'
    - name: pipeline-run-name
      type: string
      description: 'Integration pipeline run name; used to locate the Kind kubeconfig secret.'
  volumes:
    # Enlarge /dev/shm for Cypress/Chrome; default container shm (~64MB) causes flaky browser crashes
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: test-artifacts
      emptyDir: {}
    - name: oci-credentials
      secret:
        secretName: $(params.oci-credentials)
        optional: true
        items:
          - key: oci-storage-dockerconfigjson
            path: oci-storage-dockerconfigjson
    - name: codecov-credentials
      secret:
        secretName: $(params.codecov-credentials-secret)
        optional: true
  stepTemplate:
    volumeMounts:
      - name: test-artifacts
        mountPath: /artifacts
  steps:
    - name: retrieve-local-url
      results:
        - name: base-url
          description: 'Konflux base URL for Cypress tests (https://<kind-ip>:9443)'
      image: quay.io/konflux-ci/tekton-integration-catalog/utils@sha256:79707a56aa34a59f8ebb97db855114b840cbbf60bece4a0edf8ef8c7d7d5acd1
      env:
        - name: TEKTON_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [ "$(params.job-type)" = "periodic-stage" ]; then
          echo "Skipping Kind cluster setup for periodic-stage"
          : > "$(step.results.base-url.path)"
          exit 0
        fi

        echo "=== Getting PipelineRun name and kubeconfig ==="

        # Passed from the Pipeline (resolved at PipelineRun level).
        PIPELINE_RUN_NAME="$(params.pipeline-run-name)"
        NAMESPACE="${TEKTON_NAMESPACE}"
        echo "PipelineRun name: ${PIPELINE_RUN_NAME}"
        echo "Namespace: ${NAMESPACE}"

        if [[ -z "${PIPELINE_RUN_NAME}" ]]; then
          echo "ERROR: pipeline-run-name param is empty"
          exit 1
        fi

        # Construct the secret name
        SECRET_NAME="kfg-${PIPELINE_RUN_NAME}"
        echo "Looking for secret: ${SECRET_NAME}"

        # Extract kubeconfig from the secret (0600 so it is not world-readable)
        kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.kubeconfig}' \
          | base64 -d \
          | install -m 0600 /dev/stdin /tmp/kubeconfig

        # Switch to Kind cluster context
        export KUBECONFIG=/tmp/kubeconfig

        echo "=== Extracting Konflux base URL from kubeconfig ==="

        KUBE_SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
        echo "Kubernetes API server: ${KUBE_SERVER}"

        # Extract IP address (remove https:// prefix and :6443 port)
        KUBE_IP=$(echo "${KUBE_SERVER}" | sed -E 's|https?://([^:]+):.*|\1|')
        echo "Extracted IP: ${KUBE_IP}"

        CYPRESS_KONFLUX_BASE_URL="https://${KUBE_IP}:9443"
        echo "Konflux base URL: ${CYPRESS_KONFLUX_BASE_URL}"

        echo -n "${CYPRESS_KONFLUX_BASE_URL}" > "$(step.results.base-url.path)"

        echo "Setup complete. Ready for E2E tests."

    - name: run-e2e-test
      image: $(params.test-image)
      onError: continue
      computeResources:
        limits:
          memory: 3Gi
          cpu: '2'
        requests:
          memory: 2Gi
          cpu: '1'
      volumeMounts:
        # Mount the dshm (shared memory) volume at /dev/shm for UI end-to-end (E2E) tests.
        # Chromium-based browsers (such as Cypress and Playwright) require /dev/shm for reliable operation inside containers.
        - name: dshm
          mountPath: /dev/shm
      env:
        - name: CYPRESS_USERNAME
          valueFrom:
            secretKeyRef:
              name: $(params.cypress-credentials-secret)
              key: username
        - name: CYPRESS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.cypress-credentials-secret)
              key: password
        - name: CYPRESS_GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.github-credentials-secret)
              key: token
        - name: CYPRESS_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: $(params.cypress-cloud-secret)
              key: project-id
        - name: CYPRESS_RECORD_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.cypress-cloud-secret)
              key: record-key
        - name: LOCAL_KONFLUX_BASE_URL
          value: $(steps.retrieve-local-url.results.base-url)
        - name: COMMIT_INFO_SHA
          value: $(params.git-revision)
        - name: COMMIT_INFO_BRANCH
          value: $(params.commit-info-branch)
        - name: COMMIT_INFO_AUTHOR
          value: $(params.commit-info-author)
        - name: PULL_REQUEST_NUMBER
          value: $(params.pull-request-number)
        - name: TARGET_REPO_URL
          value: $(params.target-repo-url)
      script: |
        #!/usr/bin/env bash
        # Note: NOT using 'set -e' so script continues after test failure
        set -uo pipefail

        echo "=== Loading configuration ==="

        if [ "$(params.job-type)" = "periodic-stage" ]; then
          export CYPRESS_KONFLUX_BASE_URL="https://konflux-ui.apps.stone-stg-rh01.l2vh.p1.openshiftapps.com"
          export CYPRESS_LOCAL_CLUSTER=false
          export CYPRESS_PERIODIC_RUN_STAGE=true
        else
          if [ -z "${LOCAL_KONFLUX_BASE_URL}" ]; then
            echo "ERROR: LOCAL_KONFLUX_BASE_URL is missing or empty (retrieve-local-url step failed?)"
            exit 1
          fi
          export CYPRESS_KONFLUX_BASE_URL="${LOCAL_KONFLUX_BASE_URL}"
          export CYPRESS_LOCAL_CLUSTER=true
        fi
        echo "Konflux base URL: ${CYPRESS_KONFLUX_BASE_URL}"

        # Cypress Cloud commit info (e2e image has no .git)
        COMMIT_INFO_BRANCH="${COMMIT_INFO_BRANCH#refs/heads/}"
        export COMMIT_INFO_BRANCH
        [ "${COMMIT_INFO_AUTHOR:-}" = "null" ] && COMMIT_INFO_AUTHOR=""
        export COMMIT_INFO_AUTHOR

        JOB_TYPE="$(params.job-type)"
        if [ "${JOB_TYPE}" = "periodic-local" ] || [ "${JOB_TYPE}" = "periodic-stage" ]; then
          COMMIT_INFO_MESSAGE="${JOB_TYPE} $(date -u +%Y-%m-%d)"
        elif [ -n "${PULL_REQUEST_NUMBER}" ] && [ "${PULL_REQUEST_NUMBER}" != "0" ]; then
          REPO_PATH="${TARGET_REPO_URL#https://github.com/}"
          REPO_PATH="${REPO_PATH%.git}"
          COMMIT_INFO_MESSAGE=$(
            curl -sS -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO_PATH}/pulls/${PULL_REQUEST_NUMBER}" \
              | jq -r '.title // empty' 2>/dev/null || true
          )
        fi
        export COMMIT_INFO_MESSAGE="${COMMIT_INFO_MESSAGE:-${COMMIT_INFO_BRANCH}}"

        E2E_DIR=/tmp/e2e
        cd "${E2E_DIR}"
        SPEC_FILE="$(params.spec-file)"

        echo "=== Running E2E tests ==="
        echo "Working directory: ${E2E_DIR}"
        echo "Running test spec: ${SPEC_FILE}"

        ENABLE_COVERAGE="$(params.enable-coverage)"
        if [ "$(params.job-type)" = "periodic-stage" ]; then
          ENABLE_COVERAGE="false"
        fi
        echo "Coverage collection: ${ENABLE_COVERAGE}"

        RECORD_ARGS=()
        if [ -n "${CYPRESS_PROJECT_ID:-}" ] && [ -n "${CYPRESS_RECORD_KEY:-}" ]; then
          RECORD_ARGS+=(--record --tag "$(params.job-type)")
          echo "Cypress Cloud recording enabled (tag=$(params.job-type))"
        else
          echo "Cypress Cloud recording disabled (missing PROJECT_ID or RECORD_KEY)"
        fi

        # Run tests and capture exit code (don't exit on failure)
        set +e
        if [ "${ENABLE_COVERAGE}" = "true" ]; then
          yarn run cy:run:coverage --spec "${SPEC_FILE}" "${RECORD_ARGS[@]}"
        else
          yarn run cy:run --spec "${SPEC_FILE}" "${RECORD_ARGS[@]}"
        fi
        TEST_RESULT=$?
        set -e

        echo ""
        echo "=========================================="
        echo "Test completed with exit code: ${TEST_RESULT}"
        echo "=========================================="
        echo ""

        echo "=== Collecting test artifacts ==="
        mkdir -p /artifacts

        # Copy Cypress artifacts from whichever source tree was used for the run
        if [ -d "${E2E_DIR}/cypress/videos" ]; then
          echo "Copying videos..."
          cp -r "${E2E_DIR}/cypress/videos" /artifacts/ || true
        fi

        if [ -d "${E2E_DIR}/cypress/screenshots" ]; then
          echo "Copying screenshots..."
          cp -r "${E2E_DIR}/cypress/screenshots" /artifacts/ || true
        fi

        # Copy test reports
        # PR comment task expects e2e-report.xml; Cypress writes junit-[hash].xml
        for f in "${E2E_DIR}"/cypress/junit-*.xml; do
          if [ -f "$f" ]; then
            echo "Copying JUnit report: $f -> /artifacts/e2e-report.xml"
            cp "$f" /artifacts/e2e-report.xml || true
            break
          fi
        done

        # Copy Istanbul coverage output for Codecov / OCI artifacts
        if [ -d "${E2E_DIR}/.nyc_output" ]; then
          echo "Copying coverage data from ${E2E_DIR}/.nyc_output..."
          cp -a "${E2E_DIR}/.nyc_output" /artifacts/ || true
        else
          echo "No .nyc_output directory found under ${E2E_DIR}"
        fi

        # Create a simple test log
        echo "Test execution completed with exit code: ${TEST_RESULT}" > /artifacts/e2e-tests.log
        echo "Timestamp: $(date)" >> /artifacts/e2e-tests.log
        echo "Base URL: ${CYPRESS_KONFLUX_BASE_URL}" >> /artifacts/e2e-tests.log
        echo "Coverage enabled: ${ENABLE_COVERAGE}" >> /artifacts/e2e-tests.log

        # Save test result for later steps
        echo "${TEST_RESULT}" > /artifacts/test-exit-code
        echo "${ENABLE_COVERAGE}" > /artifacts/coverage-enabled

        # List collected artifacts
        echo "Artifacts collected:"
        ls -lah /artifacts/

        # Now exit with the test result
        echo ""
        echo "=== Final Result ==="
        if [ ${TEST_RESULT} -ne 0 ]; then
          echo "❌ E2E tests failed with exit code: ${TEST_RESULT}"
          exit ${TEST_RESULT}
        else
          echo "✅ E2E tests passed"
          exit 0
        fi

    - name: upload-coverage
      onError: continue
      image: quay.io/konflux-ci/konflux-devprod/coverport-cli@sha256:f8c2b29053ef103999509ae77dabe6cd0e276bee7770e420f2cc06e0b7e5acf3
      env:
        - name: CODECOV_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.codecov-credentials-secret)
              key: token
              optional: true
        - name: SOURCE_REPO_URL
          value: $(params.source-repo-url)
        - name: GIT_REVISION
          value: $(params.git-revision)
        - name: TARGET_REPO_URL
          value: $(params.target-repo-url)
      volumeMounts:
        - name: codecov-credentials
          mountPath: /codecov-credentials
          readOnly: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [ "$(params.enable-coverage)" != "true" ] || [ "$(params.job-type)" = "periodic-stage" ]; then
          echo "Coverage upload skipped (enable-coverage=$(params.enable-coverage), job-type=$(params.job-type))"
          exit 0
        fi

        COVERAGE_DIR="/artifacts/.nyc_output"
        if [ ! -d "${COVERAGE_DIR}" ] || [ ! -f "${COVERAGE_DIR}/out.json" ]; then
          echo "No coverage data at ${COVERAGE_DIR}/out.json — skipping Codecov upload"
          exit 0
        fi

        if [ -z "${CODECOV_TOKEN:-}" ] && [ -f /codecov-credentials/token ]; then
          CODECOV_TOKEN="$(cat /codecov-credentials/token)"
          export CODECOV_TOKEN
        fi

        if [ -z "${CODECOV_TOKEN:-}" ]; then
          echo "CODECOV_TOKEN not available — skipping Codecov upload"
          exit 0
        fi

        REPO_URL="${TARGET_REPO_URL:-${SOURCE_REPO_URL}}"
        COMMIT_SHA="${GIT_REVISION}"
        if [ -z "${REPO_URL}" ] || [ -z "${COMMIT_SHA}" ]; then
          echo "Missing repo URL or commit SHA — skipping Codecov upload"
          exit 0
        fi

        echo "=== Uploading e2e coverage to Codecov ==="
        echo "Repository: ${REPO_URL}"
        echo "Commit SHA: ${COMMIT_SHA}"

        COVERPORT_BIN="$(command -v coverport || true)"
        if [ -z "${COVERPORT_BIN}" ]; then
          for candidate in /usr/local/bin/coverport /usr/bin/coverport /bin/coverport; do
            if [ -x "${candidate}" ]; then
              COVERPORT_BIN="${candidate}"
              break
            fi
          done
        fi
        if [ -z "${COVERPORT_BIN}" ]; then
          echo "WARN: coverport binary not found in image — skipping Codecov upload"
          exit 0
        fi

        mkdir -p /artifacts/coverport-output
        set +e
        "${COVERPORT_BIN}" process \
          --coverage-dir="${COVERAGE_DIR}" \
          --format=nyc \
          --repo-url="${REPO_URL}" \
          --commit-sha="${COMMIT_SHA}" \
          --workspace=/artifacts/coverport-output \
          --codecov-flags=e2e \
          --keep-workspace
        UPLOAD_RESULT=$?
        set -e

        if [ "${UPLOAD_RESULT}" -ne 0 ]; then
          echo "WARN: Codecov upload failed with exit code ${UPLOAD_RESULT} — not failing the Task"
          exit 0
        fi

        echo "✅ Coverage uploaded to Codecov"

    - name: secure-push-oci
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/secure-push-oci/0.2/secure-push-oci.yaml
      params:
        - name: workdir-path
          value: /artifacts
        - name: oci-ref
          value: $(params.oci-ref)
        - name: credentials-volume-name
          value: oci-credentials
        - name: credentials-volume-key
          value: oci-storage-dockerconfigjson

    - name: fail-if-any-step-failed
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/fail-if-any-step-failed/0.1/fail-if-any-step-failed.yaml
